name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Neovim ${{ matrix.neovim }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            neovim: v0.11.4
          - os: ubuntu-latest
            neovim: stable
          - os: ubuntu-latest
            neovim: nightly
          - os: macos-latest
            neovim: stable
          - os: windows-latest
            neovim: stable

    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          version: ${{ matrix.neovim }}
          neovim: true
      - name: Show Neovim version
        run: nvim --version
      - name: Run tests
        run: nvim --headless --noplugin -u tests/minimal_init.lua -l tests/run.lua
